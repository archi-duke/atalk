<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ATalk</title>
<!--ATALK_DATA-->
<style>
  :root {
    --bg:#f4f5f7; --panel:#ffffff; --fg:#1c1d1f; --muted:#6f737a; --line:#e2e4e8; --hover:#f0f2f5; --sel:#e8eefb;
    --chat:#dfe6ee; --bubble:#ffffff; --mine:#fbe18a; --mine-fg:#1c1d1f; --sys:#5f6b78; --sys-bg:rgba(30,40,55,.10);
    --unread:#d9930d; --task:#b45f06; --result:#18794e; --status:#4b5563; --fail:#c0362c; --accent:#2f6fde;
    --quote:rgba(0,0,0,.06);
  }
  @media (prefers-color-scheme: dark) { :root {
    --bg:#121417; --panel:#1a1d21; --fg:#e9eaec; --muted:#9aa0a8; --line:#2b2f35; --hover:#22262b; --sel:#1f2a3d;
    --chat:#171b20; --bubble:#262b31; --mine:#6e5a1c; --mine-fg:#fff6d6; --sys:#a3acb6; --sys-bg:rgba(255,255,255,.07);
    --unread:#f0b43c; --task:#f0a04b; --result:#4cc38a; --status:#a3acb6; --fail:#ff6b5f; --accent:#7aa2ff; --quote:rgba(255,255,255,.07);
  } }
  * { box-sizing:border-box; }
  [hidden] { display:none !important; }
  html, body { height:100%; }
  body { margin:0; font:14px/1.45 -apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif; background:var(--bg); color:var(--fg); }
  button, select { font:inherit; color:inherit; }
  .app { display:grid; grid-template-columns:300px 1fr; height:100vh; }
  .static .app { grid-template-columns:1fr; }

  /* 대화방 목록 */
  aside { background:var(--panel); border-right:1px solid var(--line); display:flex; flex-direction:column; min-height:0; }
  .static aside { display:none; }
  .side-head { padding:16px 16px 8px; display:flex; align-items:baseline; justify-content:space-between; }
  .side-head h1 { font-size:18px; margin:0; }
  .side-head span { color:var(--muted); font-size:12px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; min-width:0; margin-left:12px; direction:rtl; }
  .tabs { display:flex; gap:4px; padding:0 12px 8px; }
  .tabs button { border:0; background:none; padding:6px 10px; border-radius:8px; cursor:pointer; color:var(--muted); }
  .tabs button.on { background:var(--hover); color:var(--fg); font-weight:600; }
  .list { overflow:auto; flex:1; }
  .row { display:flex; gap:10px; padding:10px 16px; cursor:pointer; align-items:center; }
  .row:hover { background:var(--hover); }
  .row.sel { background:var(--sel); }
  .row .txt { flex:1; min-width:0; }
  .row .top { display:flex; justify-content:space-between; gap:8px; }
  .row .title { font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .row .when { color:var(--muted); font-size:11px; flex:none; }
  .row .prev { color:var(--muted); font-size:12px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .room-ico { width:44px; height:44px; border-radius:16px; background:var(--chat); display:grid; place-items:center; font-weight:700; color:var(--sys); flex:none; }
  .dot { display:inline-block; width:7px; height:7px; border-radius:50%; margin-right:4px; vertical-align:middle; }
  .st-in_room { background:#2fb36b; } .st-away { background:#e0a526; } .st-waiting { background:#7aa2ff; } .st-offline { background:#9aa0a8; }
  .empty { color:var(--muted); padding:24px 16px; text-align:center; }

  /* 대화창 */
  section { display:flex; flex-direction:column; min-height:0; min-width:0; background:var(--chat); }
  .chat-head { display:flex; align-items:center; gap:10px; padding:10px 16px; background:var(--chat); border-bottom:1px solid var(--line); }
  .chat-head .back { display:none; border:0; background:none; font-size:20px; cursor:pointer; padding:0 6px 0 0; }
  .chat-head h2 { margin:0; font-size:16px; }
  .chat-head .sub { color:var(--muted); font-size:12px; }
  .chat-head .grow { flex:1; min-width:0; }
  .chat-head h2, .chat-head .sub { white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .chat-head select { max-width:40%; }
  .chat-head select, .chat-head .btn { border:1px solid var(--line); background:var(--panel); border-radius:8px; padding:4px 8px; font-size:12px; cursor:pointer; text-decoration:none; color:var(--fg); }
  .members { display:none; padding:8px 16px; background:var(--panel); border-bottom:1px solid var(--line); font-size:12px; color:var(--muted); }
  .members.open { display:block; }
  .members span { display:inline-block; margin:2px 10px 2px 0; }
  #msgs { flex:1; overflow-y:auto; overflow-x:hidden; padding:12px 12px 20px; }

  .day { text-align:center; margin:14px 0 10px; }
  .day span, .sys span { display:inline-block; background:var(--sys-bg); color:var(--sys); font-size:12px; padding:3px 12px; border-radius:12px; }
  .sys { text-align:center; margin:6px 0; }

  .m { display:flex; gap:8px; margin-top:2px; align-items:flex-start; }
  .m.first { margin-top:10px; }
  .m.mine { flex-direction:row-reverse; }
  .ava { width:38px; height:38px; border-radius:14px; display:grid; place-items:center; color:#fff; font-weight:700; font-size:15px; flex:none; }
  .ava.blank { visibility:hidden; height:0; }
  .m.mine .ava { display:none; }
  .col { display:flex; flex-direction:column; max-width:min(72%, 640px); min-width:0; }
  .col > * { max-width:100%; }
  .line { min-width:0; }
  .m.mine .col { align-items:flex-end; }
  .who { font-size:12px; color:var(--fg); margin:0 0 4px 2px; }
  .who .tag { font-size:10px; font-weight:700; padding:1px 5px; border-radius:6px; background:#e0a526; color:#fff; margin-left:4px; vertical-align:1px; }
  /* 말풍선 + 옆의 시각/안 읽은 수. 그리드로 말풍선이 남는 폭 안에서만 늘어나게 함 */
  .line { display:grid; grid-template-columns:minmax(0,auto) auto; align-items:end; gap:5px; }
  .m.mine .line { grid-template-columns:auto minmax(0,auto); }
  .m.mine .line .meta { order:-1; }
  .bubble { background:var(--bubble); padding:8px 11px; border-radius:4px 14px 14px 14px; white-space:pre-wrap; word-break:break-word; overflow-wrap:anywhere; min-width:0; }
  .m.mine .bubble { background:var(--mine); color:var(--mine-fg); border-radius:14px 4px 14px 14px; }
  .m:not(.first) .bubble { border-radius:14px; }
  .bubble code { font:12.5px ui-monospace,Consolas,monospace; background:var(--quote); padding:0 4px; border-radius:4px; }
  .chip { display:inline-block; font-size:11px; font-weight:700; margin-bottom:4px; }
  .chip.task { color:var(--task); } .chip.result { color:var(--result); } .chip.status { color:var(--status); }
  .chip .to { font-weight:400; color:var(--muted); margin-left:4px; }
  .quote { display:block; border-left:3px solid var(--muted); background:var(--quote); padding:4px 8px; margin-bottom:6px; border-radius:4px; font-size:12px; color:var(--muted); cursor:pointer; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:100%; }
  .quote b { color:var(--fg); }
  .meta { display:flex; flex-direction:column; align-items:flex-start; font-size:10.5px; color:var(--muted); flex:none; line-height:1.2; }
  .m.mine .meta { align-items:flex-end; }
  .meta .n { color:var(--unread); font-weight:700; }
  .logs { font-size:11px; color:var(--muted); margin:3px 4px 0; }
  .logs .failed { color:var(--fail); }
  .flash { animation:flash 1.2s; }
  @keyframes flash { 0%,40% { box-shadow:0 0 0 3px var(--accent); } 100% { box-shadow:none; } }

  @media (max-width: 760px) {
    .app { grid-template-columns:1fr; }
    .app.chatting aside { display:none; }
    .app:not(.chatting) section { display:none; }
    .chat-head .back { display:block; }
    .static .chat-head .back { display:none; }
    .col { max-width:82%; }
  }
</style>
</head>
<body>
<div class="app" id="app">
  <aside>
    <div class="side-head"><h1>ATalk</h1><span id="root"></span></div>
    <div class="tabs"><button data-tab="rooms" class="on">대화방</button><button data-tab="agents">에이전트</button></div>
    <div class="list" id="list"><div class="empty">불러오는 중…</div></div>
  </aside>
  <section>
    <div class="chat-head" id="head" hidden>
      <button class="back" id="back" aria-label="뒤로">‹</button>
      <div class="grow"><h2 id="title"></h2><div class="sub" id="sub"></div></div>
      <select id="view" title="누구의 시점으로 볼지 (오른쪽 말풍선)"></select>
      <a class="btn" id="export" title="이 대화를 HTML 파일로 저장">내보내기</a>
    </div>
    <div class="members" id="members"></div>
    <div id="msgs"><div class="empty">왼쪽에서 대화방을 고르세요.</div></div>
  </section>
</div>
<script>
const DATA = window.ATALK_DATA || null; // 내보낸 파일이면 데이터가 들어 있음
if (DATA) document.documentElement.classList.add("static");
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const j = (u) => fetch(u).then((r) => r.json());
const KIND_COLOR = { "claude-code": "#d0704a", opencode: "#3b6fd8", codex: "#139a74", gemini: "#7b5cd6" };
const STATE_KO = { received: "받음", working: "처리 중", done: "완료", skipped: "건너뜀", failed: "실패" };
const TYPE_KO = { task: "작업 요청", result: "결과", status: "상태" };

let tab = "rooms", selected = null, agents = {}, rooms = [], previews = {};
let viewer = localGet("atalk.viewer") || "human";

function localGet(k) { try { return localStorage.getItem(k); } catch { return null; } }
function localSet(k, v) { try { localStorage.setItem(k, v); } catch {} }

const nameOf = (id) => agents[id]?.name || id;
function hhmm(ts) { const d = new Date(ts); return d.toLocaleTimeString("ko-KR", { hour: "numeric", minute: "2-digit" }); }
function dayKey(ts) { const d = new Date(ts); return d.getFullYear() + "-" + d.getMonth() + "-" + d.getDate(); }
function dayLabel(ts) { return new Date(ts).toLocaleDateString("ko-KR", { year: "numeric", month: "long", day: "numeric", weekday: "long" }); }
function shortWhen(ts) {
  if (!ts) return "";
  const d = new Date(ts), now = new Date();
  return dayKey(ts) === dayKey(now.toISOString()) ? hhmm(ts) : d.toLocaleDateString("ko-KR", { month: "numeric", day: "numeric" });
}
function clean(s) { return String(s ?? "").replace(/^﻿/, ""); }
// 가벼운 서식: `코드`, **굵게**
function fmt(s) {
  return esc(clean(s)).replace(/`([^`\n]+)`/g, "<code>$1</code>").replace(/\*\*([^*\n]+)\*\*/g, "<b>$1</b>");
}
function avatar(m) {
  if (m.human) return '<div class="ava" style="background:#e0a526">' + esc([...m.human][0] || "?") + "</div>";
  const a = agents[m.from];
  const color = KIND_COLOR[a?.kind] || "#8a9099";
  return '<div class="ava" style="background:' + color + '" title="' + esc(a?.kind || "") + '">' + esc([...nameOf(m.from)][0] || "?") + "</div>";
}
function senderLabel(m) {
  return m.human ? esc(m.human) + "@" + esc(nameOf(m.from)) + '<span class="tag">사람</span>' : esc(nameOf(m.from));
}
const isMine = (m) => (viewer === "human" ? !!m.human : m.from === viewer);

// ───────── 왼쪽 목록 ─────────
async function loadSide() {
  if (DATA) return;
  const [h, a, r] = await Promise.all([j("/health"), j("/agents"), j("/rooms?include_closed=1")]);
  $("#root").textContent = h.root || "";
  agents = Object.fromEntries((a.agents || []).map((x) => [x.id, x]));
  rooms = r.rooms || [];
  await Promise.all(rooms.map(async (x) => {
    if (!x.last_seq || previews[x.room_id]?.seq === x.last_seq) return;
    const m = await j("/rooms/" + encodeURIComponent(x.room_id) + "/messages?after=" + (x.last_seq - 1) + "&limit=1");
    previews[x.room_id] = (m.messages || [])[0];
  }));
  renderSide();
}
function renderSide() {
  if (tab === "agents") {
    const list = Object.values(agents).sort((p, q) => (p.status === "offline") - (q.status === "offline"));
    $("#list").innerHTML = list.map((x) =>
      '<div class="row"><div class="ava" style="background:' + (KIND_COLOR[x.kind] || "#8a9099") + '">' + esc([...x.name][0] || "?") + '</div><div class="txt">' +
      '<div class="top"><span class="title">' + esc(x.name) + '</span><span class="when"><span class="dot st-' + x.status + '"></span>' + x.status + "</span></div>" +
      '<div class="prev">' + esc(x.kind) + (x.room ? " · " + esc(x.room) + (x.role === "owner" ? " (방장)" : "") : "") + (x.description ? " · " + esc(x.description) : "") + "</div></div></div>"
    ).join("") || '<div class="empty">등록된 에이전트 없음</div>';
    return;
  }
  const sorted = [...rooms].sort((p, q) => (previews[q.room_id]?.ts || "").localeCompare(previews[p.room_id]?.ts || ""));
  $("#list").innerHTML = sorted.map((x) => {
    const p = previews[x.room_id];
    const prev = p ? (p.type === "system" ? clean(p.body) : (p.human ? p.human + "@" : "") + nameOf(p.from) + ": " + clean(p.body)) : "메시지 없음";
    return '<div class="row' + (x.room_id === selected ? " sel" : "") + '" data-r="' + esc(x.room_id) + '"><div class="room-ico">' + esc([...(x.title || x.room_id)][0]) + "</div>" +
      '<div class="txt"><div class="top"><span class="title">' + esc(x.title || x.room_id) + ' <span class="when">' + x.members.length + "</span>" + (x.closed_at ? ' <span class="when">닫힘</span>' : "") +
      '</span><span class="when">' + shortWhen(p?.ts) + '</span></div><div class="prev">' + esc(prev.split("\n")[0]) + "</div></div></div>";
  }).join("") || '<div class="empty">대화방 없음</div>';
  document.querySelectorAll(".row[data-r]").forEach((el) => (el.onclick = () => openRoom(el.dataset.r)));
}
document.querySelectorAll(".tabs button").forEach((b) => (b.onclick = () => {
  tab = b.dataset.tab;
  document.querySelectorAll(".tabs button").forEach((x) => x.classList.toggle("on", x === b));
  renderSide();
}));

// ───────── 대화창 ─────────
let chat = null; // { room, messages, logs }
function openRoom(r) {
  selected = r;
  $("#app").classList.add("chatting");
  renderSide();
  loadChat(true);
}
$("#back").onclick = () => { $("#app").classList.remove("chatting"); };
$("#title").onclick = () => $("#members").classList.toggle("open");

async function loadChat(scroll) {
  if (DATA) { chat = DATA; agents = Object.fromEntries((DATA.agents || []).map((x) => [x.id, x])); }
  else {
    if (!selected) return;
    const r = encodeURIComponent(selected);
    const [room, m, l] = await Promise.all([j("/rooms/" + r), j("/rooms/" + r + "/messages?limit=1000"), j("/rooms/" + r + "/logs")]);
    let messages = m.messages || [];
    while (messages.length && messages.length % 1000 === 0) { // 1000개씩 끊어 읽기
      const more = (await j("/rooms/" + r + "/messages?limit=1000&after=" + messages[messages.length - 1].seq)).messages || [];
      if (!more.length) break;
      messages = messages.concat(more);
    }
    chat = { room: room.room, messages, logs: l.logs || [] };
  }
  renderChat(scroll);
}

function renderChat(scroll) {
  const box = $("#msgs");
  const atBottom = box.scrollHeight - box.scrollTop - box.clientHeight < 60;
  const room = chat.room, msgs = chat.messages || [];
  $("#head").hidden = false;
  $("#title").textContent = room.title || room.room_id;
  $("#sub").textContent = "멤버 " + room.members.length + (room.closed_at ? " · 닫힌 방" : "") + (DATA ? " · " + new Date(DATA.exported_at).toLocaleString("ko-KR") + " 내보냄" : "");
  $("#members").innerHTML = room.members.map((m) => '<span><span class="dot st-' + m.state + '"></span>' + esc(m.name) + (m.role === "owner" ? " (방장)" : "") + "</span>").join("");
  if (DATA) $("#export").style.display = "none";
  else $("#export").href = "/rooms/" + encodeURIComponent(room.room_id) + "/export?download=1";

  // 시점 선택: 사람 / 각 에이전트
  const ids = [...new Set(msgs.filter((m) => m.type !== "system").map((m) => m.from).concat(room.members.map((m) => m.agent)))];
  const opts = [["human", "사람 시점"]].concat(ids.map((id) => [id, nameOf(id) + " 시점"]));
  if (!opts.some(([v]) => v === viewer)) viewer = "human";
  $("#view").innerHTML = opts.map(([v, t]) => '<option value="' + esc(v) + '"' + (v === viewer ? " selected" : "") + ">" + esc(t) + "</option>").join("");

  const bySeq = Object.fromEntries(msgs.map((m) => [m.seq, m]));
  const logs = {};
  for (const e of chat.logs || []) (logs[e.seq] ||= {})[e.agent] = e; // 에이전트별 마지막 상태
  const cursors = room.members.map((m) => [m.agent, m.cursor || 0]);

  let html = "", lastDay = "";
  msgs.forEach((m, i) => {
    const dk = dayKey(m.ts);
    if (dk !== lastDay) { html += '<div class="day"><span>' + esc(dayLabel(m.ts)) + "</span></div>"; lastDay = dk; }
    if (m.type === "system") { html += '<div class="sys"><span>' + esc(clean(m.body)) + "</span></div>"; return; }
    const prev = msgs[i - 1], next = msgs[i + 1];
    const same = (a, b) => a && b && a.type !== "system" && b.type !== "system" && a.from === b.from && (a.human || "") === (b.human || "") &&
      dayKey(a.ts) === dayKey(b.ts) && hhmm(a.ts) === hhmm(b.ts);
    const first = !same(prev, m), lastInGroup = !same(m, next);
    const mine = isMine(m);
    const unread = cursors.filter(([id, c]) => id !== m.from && c < m.seq).length;

    let inner = "";
    if (m.type !== "chat") {
      const to = (m.to || []).length ? '<span class="to">→ ' + m.to.map((t) => esc(nameOf(t))).join(", ") + "</span>" : "";
      inner += '<span class="chip ' + m.type + '">' + (TYPE_KO[m.type] || m.type) + to + "</span>\n";
    } else if ((m.to || []).length) {
      inner += '<span class="chip status"><span class="to" style="margin:0">→ ' + m.to.map((t) => esc(nameOf(t))).join(", ") + "</span></span>\n";
    }
    const q = m.reply_to ? bySeq[m.reply_to] : null;
    if (q) inner += '<span class="quote" data-seq="' + q.seq + '"><b>' + (q.human ? esc(q.human) + "@" : "") + esc(nameOf(q.from)) + "</b> " + esc(clean(q.body).replace(/\s+/g, " ").slice(0, 90)) + "</span>";
    inner += fmt(m.body);

    const lg = Object.values(logs[m.seq] || {}).map((e) =>
      '<span class="' + e.state + '">' + esc(nameOf(e.agent)) + " " + (STATE_KO[e.state] || e.state) + (e.state === "failed" && e.note ? " (" + esc(e.note) + ")" : "") + "</span>").join(" · ");
    const meta = '<div class="meta">' + (unread ? '<span class="n">' + unread + "</span>" : "") + (lastInGroup ? "<span>" + hhmm(m.ts) + "</span>" : "") + "</div>";
    html += '<div class="m' + (mine ? " mine" : "") + (first ? " first" : "") + '" id="s' + m.seq + '" title="#' + m.seq + '">' +
      (first ? avatar(m) : '<div class="ava blank"></div>') + '<div class="col">' +
      (first && !mine ? '<div class="who">' + senderLabel(m) + "</div>" : "") +
      '<div class="line"><div class="bubble">' + inner + "</div>" + meta + "</div>" +
      (lg ? '<div class="logs">' + lg + "</div>" : "") + "</div></div>";
  });
  box.innerHTML = html || '<div class="empty">메시지 없음</div>';
  box.querySelectorAll(".quote").forEach((el) => (el.onclick = () => {
    const t = document.getElementById("s" + el.dataset.seq);
    if (t) { t.scrollIntoView({ block: "center", behavior: "smooth" }); const b = t.querySelector(".bubble"); b.classList.remove("flash"); void b.offsetWidth; b.classList.add("flash"); }
  }));
  if (scroll || atBottom) box.scrollTop = box.scrollHeight;
}
$("#view").onchange = (e) => { viewer = e.target.value; localSet("atalk.viewer", viewer); renderChat(false); };

// ───────── 시작 ─────────
if (DATA) {
  document.title = (DATA.room.title || DATA.room.room_id) + " · ATalk";
  $("#app").classList.add("chatting");
  loadChat(true);
} else {
  let t = null;
  const refresh = () => { clearTimeout(t); t = setTimeout(() => { loadSide(); if (selected) loadChat(false); }, 150); };
  const es = new EventSource("/events");
  ["message", "invite", "request", "membership", "log", "agent", "room", "config"].forEach((e) => es.addEventListener(e, refresh));
  loadSide();
}
</script>
</body>
</html>
